name: Verify Agent Distribution source
description: Build a fixed-layout Agent Distribution source bundle with the CLI shipped by this Action.

inputs:
  source:
    description: Source root relative to the GitHub workspace.
    required: false
    default: agent-distribution

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build Agent Distribution source
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        AGENT_DISTRIBUTION_SOURCE: ${{ inputs.source }}
      run: bash "${GITHUB_ACTION_PATH}/build-source.sh"
