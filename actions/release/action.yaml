name: Prepare Agent Distribution Release
description: Prepare one exact bundle release revision, commit it, and push it from a release branch workflow.

inputs:
  root:
    description: Bundle root relative to the GitHub workspace. It must resolve inside a checked-out Git worktree.
    required: false
    default: skills
  bundle-version:
    description: Exact current or next bundle release revision.
    required: true

outputs:
  changed:
    description: Whether release preparation updated bundle.json or generated output.
    value: ${{ steps.release.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Prepare Agent Distribution bundle release
      id: release
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        AGENT_DISTRIBUTION_ROOT: ${{ inputs.root }}
        AGENT_DISTRIBUTION_RELEASE_BUNDLE_VERSION: ${{ inputs.bundle-version }}
      run: bash "${GITHUB_ACTION_PATH}/../run-bundle-operation.sh" release
