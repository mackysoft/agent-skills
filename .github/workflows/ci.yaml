name: ci

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA that a synchronizing workflow expects this run to verify.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: synchronized source
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Guard synchronized commit
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -n "${EXPECTED_SHA}" && "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Expected synchronized commit ${EXPECTED_SHA}, but workflow_dispatch resolved ${ACTUAL_SHA}." >&2
            exit 1
          fi

      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard bundle version ownership
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          operation="sync"
          if [[ "${HEAD_REF}" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            operation="verify-release"
          fi

          bash scripts/resolve-bundle-operation-version.sh \
            --operation "${operation}" \
            --root agent-distribution \
            --base-ref "${BASE_SHA}" \
            >/dev/null

  test:
    needs: source
    uses: ./.github/workflows/dotnet-verify.yaml
    permissions:
      contents: read

  package:
    name: package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('AgentDistribution.slnx', '**/*.csproj') }}

      - name: Pack and smoke test
        run: bash scripts/verify-packages.sh --configuration Release
