name: bundle-sync

on:
  push:
    paths:
      - agent-distribution/bundle.json
      - agent-distribution/definitions/**
      - .config/dotnet-tools.json
      - .github/workflows/bundle-sync.yaml
      - Directory.Build.props
      - actions/**
      - scripts/dotnet-common.sh
      - scripts/prepare-self-hosted-cli.sh
      - scripts/resolve-bundle-operation-version.sh
      - src/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.bundle_result.outputs.changed }}
      synchronized_sha: ${{ steps.synchronized.outputs.sha }}

    env:
      SELF_HOSTED_PACKAGE_VERSION: 0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('AgentDistribution.slnx', '**/*.csproj') }}

      - name: Prepare self-hosted Agent Distribution CLI
        run: >-
          bash scripts/prepare-self-hosted-cli.sh
          --version "${SELF_HOSTED_PACKAGE_VERSION}"
          --output "${RUNNER_TEMP}/agent-distribution-feed"

      - name: Resolve bundle operation
        id: bundle_operation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            git fetch --no-tags origin \
              "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            bundle_version="$(bash scripts/resolve-bundle-operation-version.sh \
              --operation release \
              --root agent-distribution \
              --base-ref "origin/${DEFAULT_BRANCH}")"
            echo "kind=release" >> "${GITHUB_OUTPUT}"
            echo "bundle-version=${bundle_version}" >> "${GITHUB_OUTPUT}"
          else
            echo "kind=sync" >> "${GITHUB_OUTPUT}"
          fi

      - name: Sync repository bundle
        id: sync_bundle
        if: steps.bundle_operation.outputs.kind == 'sync'
        uses: ./actions/sync
        with:
          root: agent-distribution

      - name: Prepare repository bundle release
        id: release_bundle
        if: steps.bundle_operation.outputs.kind == 'release'
        uses: ./actions/release
        with:
          root: agent-distribution
          bundle-version: ${{ steps.bundle_operation.outputs.bundle-version }}

      - name: Capture bundle operation result
        id: bundle_result
        env:
          RELEASE_CHANGED: ${{ steps.release_bundle.outputs.changed }}
          SYNC_CHANGED: ${{ steps.sync_bundle.outputs.changed }}
        run: |
          set -euo pipefail
          changed="${RELEASE_CHANGED:-${SYNC_CHANGED:-false}}"
          if [[ "${changed}" != "true" && "${changed}" != "false" ]]; then
            echo "Bundle operation did not report a valid changed result: ${changed}" >&2
            exit 1
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Capture synchronized commit
        id: synchronized
        if: steps.bundle_result.outputs.changed == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  dispatch:
    name: dispatch verification
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Dispatch verification for synchronized commit
        env:
          EXPECTED_SHA: ${{ needs.sync.outputs.synchronized_sha }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run ci.yaml
          --repo "${GITHUB_REPOSITORY}"
          --ref "${GITHUB_REF_NAME}"
          --field expected_sha="${EXPECTED_SHA}"
