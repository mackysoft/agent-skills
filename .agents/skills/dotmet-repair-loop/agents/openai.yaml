interface:
  display_name: "dotmet Repair Loop"
  short_description: "dotmet の解析結果を起点に、コード修正、rules 更新、target set 更新、実行環境修正、検証、再解析を反復し、コードベース改善を収束させる。報告、レビュー、CI 結果整理だけが目的の場合は、修正へ進むか、完了または中断として状態を残すかを判断する。dotmet 解析でコードベースを改善する作業、作業後の解析確認、CI や検証で見つかった `findings` と解析構成の不整合を収束させる作業で使う。解析構成だけを整える作業は dotmet-project-config。"
  default_prompt: "Use $dotmet-repair-loop to follow the dotmet Repair Loop workflow."

policy:
  allow_implicit_invocation: true
